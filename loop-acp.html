<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="dj"
    ></p>
    <script>
        var text ="";
        var i=50;
        while(i<100){
            text +="<br> the number is" + i;
            i++;

        }
        document.getElementById("dj").innerHTML=text;
    </script> 
</body>
</html>
